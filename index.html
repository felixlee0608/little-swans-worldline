<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小天鹅舞曲 · 瓷偶世界线</title>
<meta name="description" content="四只瓷白小天鹅在月夜湖面上起舞，每个姿态在身后冻结成一尊瓷偶；她们的世界线在时间中升起。—— Danse des petits cygnes, after Tchaikovsky.">
<meta name="theme-color" content="#04060b">
<meta property="og:type" content="website">
<meta property="og:title" content="小天鹅舞曲 · 瓷偶世界线">
<meta property="og:description" content="四只瓷白小天鹅在月夜湖面上起舞，每个姿态在身后冻结成一尊瓷偶，沿四条世界线升起。">
<meta property="og:url" content="https://felixlee0608.github.io/little-swans-worldline/">
<meta property="og:image" content="https://felixlee0608.github.io/little-swans-worldline/qa/screenshots/02-line.png">
<meta property="og:site_name" content="小天鹅舞曲 · 瓷偶世界线">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦢</text></svg>">
<style>
  @font-face { font-family: 'Cormorant'; font-style: normal; font-weight: 300 700;
    src: url(assets/fonts/cormorant-garamond-latin-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 300;
    src: url(assets/fonts/cormorant-garamond-latin-italic.woff2) format('woff2'); }
  :root {
    --ink: rgba(238, 240, 248, 0.94);
    --ink-dim: rgba(214, 222, 240, 0.6);
    --ink-faint: rgba(200, 212, 235, 0.34);
    --moon: #dce8ff;
    --warm: #ffd9a8;
    --glass: rgba(12, 16, 28, 0.42);
    --edge: rgba(200, 220, 255, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04060b; overflow: hidden; }
  body {
    color: var(--ink); font: 300 13px/1.5 'Cormorant', Georgia, 'Songti SC', serif;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

  /* ---------- opening veil: title + start gate (the click unlocks audio) ---------- */
  #gate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 42%, #0b1220 0%, #04060b 62%, #020306 100%);
    transition: opacity 1.4s ease, visibility 0s 1.5s; }
  #gate.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-in { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 24px; text-align: center; }
  .gate-rule { width: 1px; height: 54px; background: linear-gradient(to bottom, transparent, rgba(210,225,255,0.5)); margin-bottom: 12px; }
  .gate-eyebrow { font: 400 10px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.42em; text-transform: uppercase; color: var(--ink-faint); }
  .gate-title { font-size: clamp(34px, 6.4vmin, 62px); font-weight: 400; letter-spacing: 0.18em; color: #f3f6ff;
    text-shadow: 0 0 40px rgba(170, 200, 255, 0.25); margin: 10px 0 0; }
  .gate-sub { font-style: italic; font-size: clamp(13px, 1.5vmin, 16px); letter-spacing: 0.14em; color: var(--ink-dim); margin: 6px 0 26px; }
  .gate-btns { display: flex; gap: 12px; align-items: center; }
  .gate-btn { font: 400 12px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em; color: var(--ink);
    background: rgba(200, 220, 255, 0.07); border: 1px solid var(--edge); border-radius: 999px;
    padding: 11px 26px; cursor: pointer; transition: background .25s, border-color .25s, color .25s; }
  .gate-btn.primary { background: rgba(220, 232, 255, 0.16); border-color: rgba(220, 232, 255, 0.34); color: #fff;
    box-shadow: 0 0 30px rgba(160, 200, 255, 0.18); }
  .gate-btn:hover { background: rgba(220, 232, 255, 0.22); border-color: rgba(220, 232, 255, 0.45); }
  .gate-quiet { margin-top: 16px; font: 400 10.5px/1 system-ui, sans-serif; letter-spacing: 0.1em; color: var(--ink-faint); }
  .gate-load { margin-top: 22px; font: 400 10px/1 system-ui, sans-serif; letter-spacing: 0.22em; color: rgba(190, 205, 235, 0.5); }
  #gate .err { margin-top: 18px; max-width: 460px; color: #ffb4b4; font: 400 12px/1.6 system-ui, sans-serif; letter-spacing: 0; }

  /* ---------- quiet HUD ---------- */
  #hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 12;
    font-style: italic; font-size: 14.5px; letter-spacing: 0.14em; color: var(--ink-dim);
    padding: 8px 16px; white-space: nowrap; pointer-events: none; text-shadow: 0 0 18px rgba(0,0,0,0.9);
    transition: opacity 1.2s ease; }
  #state { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 12;
    font: 400 10.5px/1 system-ui, sans-serif; letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-dim);
    opacity: 0; pointer-events: none; transition: opacity .5s; text-shadow: 0 0 12px rgba(0,0,0,.9); white-space: nowrap; }
  #state.on { opacity: 1; }
  #copy { position: fixed; left: 16px; bottom: 12px; z-index: 11; font: 400 10.5px/1.4 system-ui, sans-serif;
    letter-spacing: .06em; color: rgba(220, 228, 245, 0.42); text-shadow: 0 0 6px #000; pointer-events: none; }
  #bar { position: fixed; left: 16px; top: 16px; z-index: 12; display: flex; gap: 8px; }
  .ibtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--edge);
    background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .2s; }
  .ibtn:hover { background: rgba(30, 40, 60, 0.6); }
  .ibtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ibtn .slash { opacity: 0; transition: opacity .2s; }
  .ibtn.muted .slash { opacity: 1; }
  #hud-right { position: fixed; right: 16px; top: 16px; z-index: 12; text-align: right; }
  #time { font: 400 10.5px/1.6 system-ui, sans-serif; letter-spacing: .14em; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  #credit { margin-top: 6px; font-size: 9.5px; letter-spacing: .04em; color: rgba(200, 212, 235, 0.3); line-height: 1.6; }
  #credit a { color: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
  #panel { position: fixed; right: 16px; bottom: 16px; z-index: 12; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .row { display: flex; align-items: center; gap: 8px; font: 400 10.5px/1 system-ui, sans-serif; color: var(--ink-dim); }
  .row button { font: 400 10.5px/1 system-ui, sans-serif; color: var(--ink); background: rgba(200,220,255,.07);
    border: 1px solid var(--edge); border-radius: 8px; padding: 6px 10px; cursor: pointer; letter-spacing: .06em; }
  .row button:hover { background: rgba(220,232,255,.18); }
  .row label { min-width: 62px; text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 110px; height: 16px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(200,220,255,.18); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4.5px; border-radius: 50%;
    background: #e6eeff; box-shadow: 0 0 10px rgba(180,210,255,.7); }
  #panel.faded { opacity: 0; pointer-events: none; }
  #panel { transition: opacity .9s ease; }
  #label { position: fixed; z-index: 13; pointer-events: none; transform: translate(16px, -30px);
    font: 400 11.5px/1 system-ui, -apple-system, sans-serif; letter-spacing: .06em; color: #fff; opacity: 0;
    text-shadow: 0 0 12px rgba(180, 210, 255, .9); transition: opacity .16s; white-space: nowrap;
    background: rgba(6, 9, 16, .42); border: 1px solid rgba(200, 220, 255, .16);
    border-radius: 999px; padding: 4px 9px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #label.on { opacity: 1; }
  @media (max-width: 760px) {
    #copy { left: 0; right: 0; text-align: center; }
    #panel { left: 12px; right: 12px; bottom: 12px; align-items: stretch; }
    .row { justify-content: space-between; }
    #hint { white-space: normal; width: calc(100% - 32px); text-align: center; line-height: 1.5; bottom: auto; top: 68px; }
  }
  @media (prefers-reduced-motion: reduce) { #gate, #hint { transition: none; } }
</style>
</head>
<body>
  <div id="stage"></div>

  <!-- opening: title + the Enter gate (its click is what lets the soundtrack start) -->
  <div id="gate" role="dialog" aria-label="小天鹅舞曲 · 瓷偶世界线">
    <div class="gate-in">
      <div class="gate-rule"></div>
      <div class="gate-eyebrow">after Tchaikovsky &nbsp;·&nbsp; swan lake &nbsp;·&nbsp; danse des petits cygnes</div>
      <h1 class="gate-title">小天鹅舞曲</h1>
      <div class="gate-sub">瓷偶世界线 &nbsp;·&nbsp; Danse des petits cygnes</div>
      <div class="gate-btns">
        <button class="gate-btn primary" id="enter" type="button" disabled>进入 · Enter</button>
        <button class="gate-btn" id="enter-quiet" type="button" disabled>无声进入</button>
      </div>
      <div class="gate-quiet">耳机更佳 &nbsp;·&nbsp; 点击进入以启动音乐</div>
      <div class="gate-load" id="load">正在为舞台布光…</div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="bar">
    <button class="ibtn" id="sound" aria-label="声音" title="声音 (M)">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
    <button class="ibtn" id="freeze" aria-label="冻结时间" title="冻结时间 (F / 空格)">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M5 7l14 10M19 7L5 17"/></svg>
    </button>
  </div>
  <div id="hud-right">
    <div id="time">00:00 / 01:36</div>
    <div id="credit">瓷偶 · 程序化 · 世界线<br>音乐 柴可夫斯基（公版曲目） · <a href="https://github.com/felixlee0608/little-swans-worldline" target="_blank" rel="noopener">GitHub</a></div>
  </div>
  <div id="state"></div>
  <div id="label"></div>
  <div id="hint">悬停看她过去的某个身影 · 按住回到那一刻 · 空格冻结</div>
  <div id="panel">
    <div class="row"><label>历史</label><input id="history" type="range" min="6" max="20" step="1" value="12"><span id="history-v">12s</span></div>
    <div class="row"><label>残影</label><input id="density" type="range" min="1" max="6" step="1" value="5"><span id="density-v">密</span></div>
    <div class="row"><button id="reset" type="button">重新开始</button><button id="hide" type="button">隐藏界面 (H)</button></div>
  </div>
  <div id="copy">© 2026 · 小天鹅舞曲 · 瓷偶世界线</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./assets/three/three.module.js",
      "three/addons/": "./assets/three/addons/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
